<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TravelEstate CRM — AI-Agentic Lead Intelligence Engine</title>

  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- React 18 Core -->
  <script
    src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"
    crossorigin
  ></script>

  <!-- React DOM 18 -->
  <script
    src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"
    crossorigin
  ></script>

  <!--
    Babel Standalone — pinned to an exact version. Previously unpinned
    (@babel/standalone with no version), which meant "latest" could shift
    the default JSX runtime or internal script-scanning behavior out from
    under us with no warning. Pinning makes the build reproducible.
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"
    crossorigin
  ></script>

  <!-- Application styles -->
  <link rel="stylesheet" href="/static/css/app.css" />
</head>

<body>
  <div id="root"></div>

  <!--
    app.jsx is intentionally NOT loaded via <script type="text/babel" src="...">.

    Babel Standalone's automatic script-tag scanner (transformScriptTags.ts)
    fetches src-based text/babel scripts and re-injects the transformed
    result via appendChild on its own, with its own internal default preset
    options. That path was producing a transformed output containing an
    `import` statement (almost certainly the automatic JSX runtime, which
    imports from "react/jsx-runtime"), which a classic, non-module <script>
    cannot execute — hence "Cannot use import statement outside a module"
    thrown from inside appendChild.

    Fetching and transforming manually below gives us explicit control over
    the preset options (runtime: "classic", matching the UMD React/ReactDOM
    globals loaded above, which have no ES module exports to import from
    anyway) and avoids Babel's automatic scanner entirely.
  -->
  <script>
    (async function loadApp() {
      const rootEl = document.getElementById("root");

      try {
        const response = await fetch("/static/js/app.jsx");
        if (!response.ok) {
          throw new Error("Failed to fetch app.jsx: HTTP " + response.status);
        }
        const source = await response.text();

        const { code } = Babel.transform(source, {
          presets: [["react", { runtime: "classic" }]],
          filename: "app.jsx",
        });

        // Execute in global scope as a classic script, matching how React/
        // ReactDOM/Babel were loaded above (UMD globals, not ES modules).
        (0, eval)(code);
      } catch (err) {
        console.error("Failed to load application:", err);
        rootEl.innerHTML =
          '<div style="color:#f87171;font-family:monospace;padding:2rem;white-space:pre-wrap;">' +
          "Failed to load application.\n\n" +
          String(err && err.message ? err.message : err) +
          "</div>";
      }
    })();
  </script>
</body>
</html>
